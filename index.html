
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cờ vua</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #eeeeee;
  color: #222;
  font-family: Arial, sans-serif;
}

h1 {
  text-align: center;
  margin: 8px 0 20px;
}

.container {
  width: min(100%, 560px);
  margin: auto;
}

#status {
  text-align: center;
  padding: 12px;
  margin-bottom: 12px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 6px;
}

#board {
  width: 100%;
  aspect-ratio: 1 / 1;
  display: grid;
  grid-template-columns: repeat(8, minmax(0, 1fr));
  grid-template-rows: repeat(8, minmax(0, 1fr));
  border: 3px solid #333;
}

.square {
  width: 100%;
  height: 100%;
  min-width: 0;
  min-height: 0;
  padding: 0;
  border: none;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  font-family: "Segoe UI Symbol", "DejaVu Sans", serif;
  font-size: clamp(20px, 7vw, 48px);
  line-height: 1;
  cursor: pointer;
}

.white {
  background: #f0d9b5;
}

.black {
  background: #b58863;
}

.square.selected {
  box-shadow: inset 0 0 0 4px #e9e052;
}

.square.last {
  background-color: #cdd26a;
}

.square.target::after {
  content: "";
  width: 22%;
  height: 22%;
  border-radius: 50%;
  background: #4b9c61;
  position: absolute;
  opacity: 0.8;
}

.square.capture::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 4px solid #b33b3b;
  border-radius: 50%;
}

.controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 14px;
}

select, button.action {
  padding: 11px;
  font-size: 15px;
  border-radius: 5px;
}

select {
  border: 1px solid #aaa;
  background: white;
}

button.action {
  background: #333;
  color: white;
  border: none;
  cursor: pointer;
}

button.action:hover {
  background: #555;
}

#history {
  margin-top: 12px;
  padding: 12px;
  background: white;
  border: 1px solid #ccc;
  border-radius: 6px;
  line-height: 1.7;
  overflow-wrap: anywhere;
}

.note {
  font-size: 13px;
  color: #555;
  line-height: 1.5;
}

@media (min-width: 600px) {
  .square {
    font-size: 48px;
  }
}
</style>
</head>

<body>
<div class="container">
  <h1>♟ CỜ VUA ♟</h1>

  <div id="status">Đang tải bàn cờ...</div>

  <div id="board"></div>

  <div class="controls">
    <select id="mode">
      <option value="ai">Đấu với máy</option>
      <option value="two">Hai người chơi</option>
    </select>

    <select id="difficulty">
      <option value="1">Máy: Dễ</option>
      <option value="2" selected>Máy: Vừa</option>
      <option value="3">Máy: Khó</option>
    </select>

    <button class="action" id="newGame">Ván mới</button>
    <button class="action" id="undo">Đi lại</button>
  </div>

  <div id="history">Lịch sử: chưa có nước đi.</div>

  <p class="note">
    Bấm quân cờ, rồi bấm ô muốn đi. Trắng đi trước.
    Bàn cờ luôn có 8 hàng, 8 cột và mỗi ô là hình vuông.
    Cần kết nối Internet để tải thư viện luật cờ vua.
  </p>
</div>

<script>
"use strict";

const board = document.getElementById("board");
const statusBox = document.getElementById("status");
const historyBox = document.getElementById("history");
const modeBox = document.getElementById("mode");
const difficultyBox = document.getElementById("difficulty");

const symbols = {
  wk: "♔", wq: "♕", wr: "♖", wb: "♗", wn: "♘", wp: "♙",
  bk: "♚", bq: "♛", br: "♜", bb: "♝", bn: "♞", bp: "♟"
};

const files = "abcdefgh";

let game;
let selected = null;
let legalMoves = [];
let lastMove = null;
let historyFens = [];
let thinking = false;
let version = 0;

function nameOf(row, col) {
  return files[col] + (8 - row);
}

function isComputerTurn() {
  return modeBox.value === "ai" && game.turn() === "b";
}

function newGame() {
  version++;
  game = new Chess();
  selected = null;
  legalMoves = [];
  lastMove = null;
  historyFens = [];
  thinking = false;
  render();
  updateStatus();
}

function render() {
  board.innerHTML = "";

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const square = nameOf(row, col);
      const piece = game.get(square);
      const cell = document.createElement("button");

      cell.type = "button";
      cell.className =
        "square " + ((row + col) % 2 === 0 ? "white" : "black");

      if (square === selected) {
        cell.classList.add("selected");
      }

      if (lastMove &&
          (square === lastMove.from || square === lastMove.to)) {
        cell.classList.add("last");
      }

      if (legalMoves.some(move => move.to === square)) {
        cell.classList.add(piece ? "capture" : "target");
      }

      if (piece) {
        cell.textContent = symbols[piece.color + piece.type];
        cell.title =
          (piece.color === "w" ? "Trắng " : "Đen ") + piece.type;
      }

      cell.addEventListener("click", () => clickSquare(square));
      board.appendChild(cell);
    }
  }
}

function clickSquare(square) {
  if (thinking || game.game_over() || isComputerTurn()) return;

  if (selected &&
      legalMoves.some(move => move.to === square)) {
    movePiece(selected, square);
    return;
  }

  const piece = game.get(square);

  if (piece && piece.color === game.turn()) {
    selected = square;
    legalMoves = game.moves({
      square: square,
      verbose: true
    });
  } else {
    selected = null;
    legalMoves = [];
  }

  render();
}

function movePiece(from, to) {
  const before = game.fen();

  const move = game.move({
    from: from,
    to: to,
    promotion: "q"
  });

  if (!move) return;

  historyFens.push(before);
  lastMove = { from: from, to: to };
  selected = null;
  legalMoves = [];

  render();
  updateStatus();

  if (!game.game_over() && isComputerTurn()) {
    thinking = true;
    updateStatus();
    const currentVersion = version;

    setTimeout(() => computerMove(currentVersion), 150);
  }
}

const values = {
  p: 100,
  n: 320,
  b: 330,
  r: 500,
  q: 900,
  k: 20000
};

function evaluate() {
  let score = 0;

  for (let row = 0; row < 8; row++) {
    for (let col = 0; col < 8; col++) {
      const piece = game.get(nameOf(row, col));
      if (!piece) continue;

      let value = values[piece.type];

      const center =
        Math.abs(3.5 - row) + Math.abs(3.5 - col);

      value += Math.round((7 - center) * 3);

      if (piece.type === "p") {
        value += piece.color === "w"
          ? (6 - row) * 5
          : (row - 1) * 5;
      }

      score += piece.color === "w" ? value : -value;
    }
  }

  return score;
}

function minimax(depth, alpha, beta) {
  if (depth === 0 || game.game_over()) {
    return evaluate();
  }

  const moves = game.moves({ verbose: true });

  if (game.turn() === "w") {
    let best = -Infinity;

    for (const move of moves) {
      game.move(move);
      best = Math.max(best, minimax(depth - 1, alpha, beta));
      game.undo();

      alpha = Math.max(alpha, best);
      if (beta <= alpha) break;
    }

    return best;
  }

  let best = Infinity;

  for (const move of moves) {
    game.move(move);
    best = Math.min(best, minimax(depth - 1, alpha, beta));
    game.undo();

    beta = Math.min(beta, best);
    if (beta <= alpha) break;
  }

  return best;
}

function computerMove(currentVersion) {
  if (currentVersion !== version ||
      game.game_over() ||
      !isComputerTurn()) {
    thinking = false;
    updateStatus();
    return;
  }

  const depth = Number(difficultyBox.value);
  const moves = game.moves({ verbose: true });

  let bestScore = Infinity;
  let candidates = [];

  for (const move of moves) {
    game.move(move);
    const score = minimax(depth - 1, -Infinity, Infinity);
    game.undo();

    if (score < bestScore) {
      bestScore = score;
      candidates = [move];
    } else if (score === bestScore) {
      candidates.push(move);
    }
  }

  if (!candidates.length) {
    thinking = false;
    updateStatus();
    return;
  }

  const chosen = candidates[
    Math.floor(Math.random() * candidates.length)
  ];

  thinking = false;
  movePiece(chosen.from, chosen.to);
}

function updateStatus() {
  if (game.in_checkmate()) {
    statusBox.textContent =
      "Chiếu hết! " +
      (game.turn() === "w" ? "Đen thắng." : "Trắng thắng.");
  } else if (game.in_draw()) {
    statusBox.textContent = "Ván cờ hòa.";
  } else if (thinking) {
    statusBox.textContent = "Máy đang suy nghĩ...";
  } else {
    statusBox.textContent =
      (game.turn() === "w" ? "Lượt Trắng" : "Lượt Đen") +
      (game.in_check() ? " — Bị chiếu!" : "");
  }

  const moves = game.history();

  historyBox.textContent = "Lịch sử: " + (
    moves.length
      ? moves.map((move, index) =>
          (index % 2 === 0 ? (index / 2 + 1) + ". " : "") + move
        ).join(" ")
      : "chưa có nước đi."
  );
}

document.getElementById("newGame").addEventListener("click", newGame);

document.getElementById("undo").addEventListener("click", () => {
  if (thinking || !historyFens.length) return;

  version++;

  const count = modeBox.value === "ai" &&
    game.turn() === "w" &&
    historyFens.length >= 2 ? 2 : 1;

  for (let i = 0; i < count; i++) {
    const fen = historyFens.pop();
    if (fen) game.load(fen);
  }

  selected = null;
  legalMoves = [];
  lastMove = null;
  render();
  updateStatus();
});

modeBox.addEventListener("change", () => {
  version++;
  thinking = false;
  selected = null;
  legalMoves = [];
  render();
  updateStatus();

  if (isComputerTurn() && !game.game_over()) {
    thinking = true;
    updateStatus();
    const currentVersion = version;
    setTimeout(() => computerMove(currentVersion), 150);
  }
});

if (typeof Chess === "undefined") {
  statusBox.textContent =
    "Không tải được luật cờ vua. Hãy kiểm tra Internet và tải lại trang.";
} else {
  newGame();
}
</script>
</body>
</html>
